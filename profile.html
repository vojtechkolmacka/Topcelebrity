<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil osobnosti | TOP CELEBRITY</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">TOP <b>CELEBRITY</b></a><nav><a href="index.html">Úvod</a><a href="admin.html">Administrace</a></nav></header><main id="profile"><p class="muted">Načítám profil…</p></main><script>fetch('data/content.json').then(r=>r.json()).then(d=>{let p=d.profiles.find(x=>x.slug===new URLSearchParams(location.search).get('slug'));let el=document.querySelector('#profile');if(!p){el.textContent='Profil nebyl nalezen.';return}document.title=p.name+' | TOP CELEBRITY';el.innerHTML=`<section><p class="eyebrow">${p.category}</p><h1>${p.name}</h1><div class="avatar" style="max-width:320px;height:380px;background-size:cover;background-image:${p.portrait?`url('${p.portrait}')`:'none'}">${p.portrait?'':'PORTRÉT DOPLNIT'}</div><h2>${p.role||'Profil osobnosti'}</h2><p>${p.bio||'Životopis a další informace doplní redakce.'}</p><p><b>Datum narození:</b> ${p.birth||'Doplnit'}</p><h2>Fotogalerie</h2><div class="cards">${(p.gallery||[]).map(x=>`<img src="${x}" style="max-width:100%">`).join('')}</div></section>`})</script></body></html>
